name: ComicFlow secrets readiness
on:
  push:
    branches: ["fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required repository secrets without printing values
        env:
          API_URL: ${{ secrets.COMICFLOW_API_URL }}
          WORKER_SECRET: ${{ secrets.COMICFLOW_WORKER_SECRET }}
          BLOB_TOKEN: ${{ secrets.BLOB_PUBLIC_READ_WRITE_TOKEN }}
        run: |
          missing=0
          for pair in "COMICFLOW_API_URL:$API_URL" "COMICFLOW_WORKER_SECRET:$WORKER_SECRET" "BLOB_PUBLIC_READ_WRITE_TOKEN:$BLOB_TOKEN"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name: configured"
            else
              echo "$name: MISSING"
              missing=1
            fi
          done
          test "$missing" -eq 0
